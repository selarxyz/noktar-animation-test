<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Noktar — próba wiernych warstw</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111215;color:#e4c994;font-family:system-ui,sans-serif;touch-action:none}#canvas{display:block;width:100%;height:100%;outline:none}#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#111215;gap:16px;z-index:10}h1{font-size:24px;margin:0}p{font-size:15px;margin:0}progress{accent-color:#c59557;width:230px}#error{max-width:600px;padding:24px;white-space:pre-wrap}</style></head>
<body><canvas id="canvas" tabindex="0">Ta próba wymaga WebGL 2.</canvas><div id="status"><h1>NOKTAR / WIERNE WARSTWY</h1><p id="message">Przygotowywanie porównania…</p><progress id="progress"></progress><div id="error" hidden></div></div><script src="index.js"></script><script>
const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":788304,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};const engine=new Engine(config);const status=document.getElementById('status');const progress=document.getElementById('progress');
engine.startGame({onProgress:(current,total)=>{if(total>0){progress.max=total;progress.value=current;}}}).then(()=>{status.remove();document.getElementById('canvas').focus();}).catch(error=>{document.getElementById('message').textContent='Nie udało się uruchomić podglądu.';const box=document.getElementById('error');box.hidden=false;box.textContent=String(error);progress.hidden=true;});
window.addEventListener('contextmenu',event=>event.preventDefault());
</script></body></html>
