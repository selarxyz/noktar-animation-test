<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#110d0a"><title>Era Podziemia — Arena</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090705;color:#dfc397;font-family:system-ui,sans-serif;touch-action:none}#canvas{display:block;width:100%;height:100%;outline:none}#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#110d0a;gap:16px;z-index:10}#status h1{font-size:25px;letter-spacing:5px;font-weight:500;margin:0}#status p{color:#a99273;font-size:13px}progress{accent-color:#b38d50;width:210px;height:4px;border:0}#error{max-width:600px;padding:25px;line-height:1.7;text-align:center}</style></head>
<body><canvas id="canvas" tabindex="0">Twoja przeglądarka musi obsługiwać WebGL 2.</canvas><div id="status"><h1>ERA PODZIEMIA</h1><p id="message">Przygotowywanie areny…</p><progress id="progress"></progress><div id="error" hidden></div></div><script src="index.js"></script><script>
const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":727720,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};const engine=new Engine(config);const status=document.getElementById('status');const progress=document.getElementById('progress');
engine.startGame({onProgress:(current,total)=>{if(total>0){progress.max=total;progress.value=current;}}}).then(()=>{status.remove();document.getElementById('canvas').focus();}).catch(error=>{document.getElementById('message').textContent='Nie udało się uruchomić areny.';const box=document.getElementById('error');box.hidden=false;box.textContent=String(error);progress.hidden=true;});
window.addEventListener('contextmenu',event=>event.preventDefault());
</script></body></html>
